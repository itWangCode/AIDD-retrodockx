[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "retrodockx"
version = "1.0.0"
description = "RetroDock-X: Retrosynthesis planning + docking-guided ML route reranking with SHAP explainability"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["retrosynthesis", "drug-discovery", "machine-learning", "SHAP", "cheminformatics"]

dependencies = [
    "rdkit>=2023.3.1",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "networkx>=3.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "shap>=0.42.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
full = ["lightgbm>=4.0.0", "aizynthfinder", "askcos"]
dev  = ["pytest>=7.0", "black", "isort"]

[project.scripts]
retrodockx = "retrodockx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
